trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - frontend/**

variables:
  - group: taskapp-variables

stages:
  - stage: BuildAndDeploy
    displayName: 'Build and Deploy Frontend'
    jobs:
      - job: BuildAndDeployJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'

          - script: |
              cd frontend/react-todo
              npm ci
              npm run build
            displayName: 'Build React App'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Static Web App'
            inputs:
              azure_static_web_apps_api_token: $(STATIC_WEB_APP_TOKEN)
              app_location: 'frontend/react-todo'
              output_location: 'build'